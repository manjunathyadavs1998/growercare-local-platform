# GrowerCare local development stack.
# Usage (from gc-backend/local-dev):  cp .env.example .env  &&  docker compose up -d
# Dev only: credentials come from .env (git-ignored). Production uses Secrets Manager (see docs/architecture/07_DEPLOYMENT_AWS.md).
name: growercare

services:
  postgres:
    image: postgres:17.6-alpine
    container_name: gc-postgres
    environment:
      POSTGRES_USER: ${PG_SUPERUSER}
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      # Consumed by postgres/01-init.sh to create per-service databases and roles
      GC_IAM_OWNER_PASSWORD: ${GC_IAM_OWNER_PASSWORD}
      GC_IAM_APP_PASSWORD: ${GC_IAM_APP_PASSWORD}
      GC_CASE_OWNER_PASSWORD: ${GC_CASE_OWNER_PASSWORD}
      GC_CASE_APP_PASSWORD: ${GC_CASE_APP_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    command:
      - postgres
      - -c
      - wal_level=logical          # Debezium-ready (data platform, later)
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=500
    ports:
      - "5432:5432"
    volumes:
      - gc-pgdata:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_SUPERUSER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: gc-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: gc-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl; use bash /dev/tcp against the management port (9000)
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  gc-pgdata:
