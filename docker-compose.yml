# GrowerCare local development stack.
# Usage (from gc-backend/local-dev):  cp .env.example .env  &&  docker compose up -d
# Dev only: credentials come from .env (git-ignored). Production uses Secrets Manager (see docs/architecture/07_DEPLOYMENT_AWS.md).
name: growercare

services:
  postgres:
    image: postgres:17.6-alpine
    container_name: gc-postgres
    environment:
      POSTGRES_USER: ${PG_SUPERUSER}
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      # Consumed by postgres/01-init.sh to create per-service databases and roles
      GC_IAM_OWNER_PASSWORD: ${GC_IAM_OWNER_PASSWORD}
      GC_IAM_APP_PASSWORD: ${GC_IAM_APP_PASSWORD}
      GC_CASE_OWNER_PASSWORD: ${GC_CASE_OWNER_PASSWORD}
      GC_CASE_APP_PASSWORD: ${GC_CASE_APP_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      GC_CDC_PASSWORD: ${GC_CDC_PASSWORD}          # postgres/02-cdc-role.sh (Debezium login, SPEC-PLAT-04 D8)
    command:
      - postgres
      - -c
      - wal_level=logical          # Debezium outbox connectors (SPEC-PLAT-04)
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=500
    ports:
      - "5432:5432"
    volumes:
      - gc-pgdata:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_SUPERUSER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: gc-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    container_name: gc-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl; use bash /dev/tcp against the management port (9000)
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ------------------------------------------------------------------ attachments (SPEC-CASE-05 D2)
  # S3-compatible object store (Apache-2.0). Signatures are enforced through seaweedfs/s3.json (dev keys only).
  # case-service creates the buckets locally (gc.attachments.create-buckets=true in the local profile).
  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    container_name: gc-seaweedfs
    command: ["server", "-filer", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-s3.port=8333", "-dir=/data",
              "-volume.max=100", "-master.volumeSizeLimitMB=256"]   # one collection per bucket, several volumes each
    ports:
      - "8333:8333"
    volumes:
      - gc-s3data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # anonymous requests are refused (403) once the S3 API is up
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q '403'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ------------------------------------------------------------------ events (SPEC-PLAT-04 D1)
  # Single-node Kafka in KRaft mode (no ZooKeeper), the same product as MSK. Containers use kafka:9092, the host
  # (services, smoke test) uses localhost:9094. Data is ephemeral: Debezium resumes from its replication slot.
  kafka:
    image: apache/kafka:4.3.1
    container_name: gc-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168          # domain events: 7 days (03_TECH_STACK.md)
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  # Kafka Connect with the Debezium connectors (MSK Connect in AWS). Connectors are registered by
  # debezium/register.sh; the CDC password comes from the environment (config provider "env").
  connect:
    image: quay.io/debezium/connect:3.6.2.Final
    container_name: gc-connect
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: gc-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      GC_CDC_PASSWORD: ${GC_CDC_PASSWORD}
      HEAP_OPTS: -Xms256m -Xmx768m
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connectors > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  gc-pgdata:
  gc-s3data:
