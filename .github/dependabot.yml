# SPEC-PLAT-02 R28 / SPEC-PLAT-05 R70: weekly updates of the pinned actions and container images.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "ci" }
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "build", include: scope }
    labels: [dependencies, local-dev]
    # SPEC-PLAT-05 R70: stateful engines must match AWS and need a deliberate upgrade test.
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
