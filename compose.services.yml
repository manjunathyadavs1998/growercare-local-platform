# End-to-end (SPEC-PLAT-06 R80): the services as their released images, on the platform network.
#   docker compose -f compose.services.yml up -d --wait     (after: docker compose up -d --wait)
# Each service reads ONLY its env file (services/<name>.env, git-ignored; copy from services/<name>.env.example).
# IMAGE_TAG picks the image version (default: latest = the newest main build).
services:
  identity-access-service:
    image: ghcr.io/manjunathyadavs1998/identity-access-service:${IAM_IMAGE_TAG:-latest}
    container_name: gc-iam
    env_file: services/identity-access-service.env
    ports:
      - "8081:8081"
    restart: unless-stopped

  case-service:
    image: ghcr.io/manjunathyadavs1998/case-service:${CASE_IMAGE_TAG:-latest}
    container_name: gc-case
    env_file: services/case-service.env
    ports:
      - "8082:8082"
    depends_on:
      - identity-access-service
    restart: unless-stopped

  grower-service:
    image: ghcr.io/manjunathyadavs1998/grower-service:${GROWER_IMAGE_TAG:-latest}
    container_name: gc-grower
    profiles: ["grower"]
    env_file: services/grower-service.env
    ports:
      - "8084:8084"                                # 8083 is Kafka Connect
    depends_on:
      - identity-access-service
      - notification-service
    restart: unless-stopped

  notification-service:
    image: ghcr.io/manjunathyadavs1998/notification-service:${NOTIFICATION_IMAGE_TAG:-latest}
    container_name: gc-notification
    profiles: ["grower"]                         # grower-service sends its one-time codes through it
    env_file: services/notification-service.env
    ports:
      - "8085:8085"                                # dev mailbox: http://localhost:8085/dev/mailbox/ui?recipient=...
    restart: unless-stopped

  catalog-registry-service:
    image: ghcr.io/manjunathyadavs1998/catalog-registry-service:${CATALOG_IMAGE_TAG:-latest}
    container_name: gc-catalog
    profiles: ["catalog"]
    env_file: services/catalog-registry-service.env
    ports:
      - "8086:8086"
    depends_on:
      - identity-access-service
    restart: unless-stopped

  edge-gateway:
    image: ghcr.io/manjunathyadavs1998/edge-gateway:${EDGE_IMAGE_TAG:-latest}
    container_name: gc-edge
    profiles: ["gateway"]                        # SPEC-EDGE-01: the web apps' single entry point (/api/<service>/**)
    env_file: services/edge-gateway.env
    ports:
      - "8080:8080"
    depends_on:
      - identity-access-service
      - case-service
    restart: unless-stopped

  # SPEC-FE-04 D1/D2: the web apps as their released nginx images (profile web; needs the gateway profile).
  grower-web:
    image: ghcr.io/manjunathyadavs1998/grower-web:${WEB_IMAGE_TAG:-latest}
    container_name: gc-grower-web
    profiles: ["web"]
    env_file: services/grower-web.env
    ports:
      - "5173:8080"                                # the origin Keycloak's grower-web client redirects to
    depends_on:
      - edge-gateway
    restart: unless-stopped

  staff-console:
    image: ghcr.io/manjunathyadavs1998/staff-console:${WEB_IMAGE_TAG:-latest}
    container_name: gc-staff-console
    profiles: ["web"]
    env_file: services/staff-console.env
    ports:
      - "5174:8080"
    depends_on:
      - edge-gateway
    restart: unless-stopped

networks:
  default:
    name: growercare
    external: true                                # created by docker-compose.yml
